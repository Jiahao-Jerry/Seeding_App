<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评估 — 新架构（中文测试版）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", 'Segoe UI', system-ui, sans-serif;
  background: #0f1117; color: #e8eaf0;
  min-height: 100vh; padding: 32px 16px;
  display: flex; flex-direction: column; align-items: center;
}
.container { width: 100%; max-width: 960px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 1.5rem; color: #c4b5fd; margin-bottom: 4px; }
.header p { font-size: 0.85rem; color: #6b7280; }

.dev-toggle {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  margin-bottom: 24px; font-size: 0.85rem; color: #9ca3af; cursor: pointer;
  user-select: none;
}

.comparison {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin-bottom: 20px;
}
.panel {
  background: #1a1d2e; border: 2px solid #2a2d3e; border-radius: 14px;
  padding: 22px; line-height: 1.65; font-size: 0.95rem;
  white-space: pre-wrap; word-break: break-word; cursor: pointer;
  transition: border-color 0.15s ease, transform 0.1s ease;
}
.panel:hover { border-color: #7c3aed; transform: translateY(-2px); }
.panel.chosen { border-color: #22c55e; }

.topic-tag {
  display: inline-block; font-size: 0.7rem; font-weight: 600;
  color: #8b5cf6; background: #1e1b4b; border-radius: 6px;
  padding: 2px 8px; margin-bottom: 14px;
}

.dev-panel {
  display: none; background: #12141f; border: 1px solid #2a2d3e;
  border-radius: 10px; padding: 18px; font-size: 0.8rem; margin-bottom: 20px;
}
.dev-panel.open { display: block; }
.dev-section-title {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: #4b5563; margin: 14px 0 6px;
}
.dev-section-title:first-child { margin-top: 0; }

.verdict {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px; font-weight: 700;
  font-size: 0.75rem; letter-spacing: 0.04em;
}
.verdict.clean { background: #052e16; color: #4ade80; border: 1px solid #166534; }
.verdict.leaked { background: #1c1403; color: #fbbf24; border: 1px solid #92400e; }

.side-badge {
  display: inline-block; font-size: 0.75rem; font-weight: 700;
  padding: 3px 10px; border-radius: 6px; background: #1e1b4b; color: #a78bfa;
  margin-right: 8px;
}

.axis-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.axis-table td { padding: 4px 8px; font-size: 0.78rem; border-top: 1px solid #1e2130; }
.axis-table td:first-child { color: #9ca3af; }
.axis-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.axis-table tr.target td:first-child { color: #a78bfa; font-weight: 600; }
.axis-table tr.target td:last-child { color: #c4b5fd; font-weight: 600; }

.attempts-row { font-size: 0.76rem; color: #9ca3af; margin: 2px 0; }

.loading { text-align: center; padding: 60px; color: #6b7280; }
.instruction { text-align: center; margin-bottom: 20px; color: #9ca3af; font-size: 0.95rem; }

.progress { text-align: center; font-size: 0.78rem; color: #6b7280; margin-bottom: 10px; letter-spacing: 0.03em; }

.report { padding: 20px 0; }
.report h2 { font-size: 1.3rem; color: #c4b5fd; text-align: center; margin-bottom: 6px; }
.report .subtitle { text-align: center; color: #6b7280; font-size: 0.85rem; margin-bottom: 28px; }
.report-headline {
  text-align: center; margin-bottom: 32px;
}
.report-headline .big-number {
  font-size: 3rem; font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums;
}
.report-headline .big-number.low { color: #fbbf24; }
.report-headline .caption { color: #9ca3af; font-size: 0.85rem; margin-top: 4px; }

.axis-report-table { width: 100%; border-collapse: collapse; }
.axis-report-table th {
  text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
  color: #6b7280; padding: 8px; border-bottom: 1px solid #2a2d3e;
}
.axis-report-table th:last-child, .axis-report-table td:last-child { text-align: right; }
.axis-report-table td {
  padding: 10px 8px; border-bottom: 1px solid #1e2130; font-size: 0.88rem;
}
.axis-report-table td:first-child { color: #d1d5db; }
.win-rate-bar-wrap {
  display: flex; align-items: center; gap: 10px; justify-content: flex-end;
}
.win-rate-bar {
  width: 100px; height: 6px; background: #1e2130; border-radius: 3px; overflow: hidden;
}
.win-rate-bar-fill { height: 100%; background: #7c3aed; }
.win-rate-value { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; color: #c4b5fd; }

.trial-kind-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px; font-weight: 700;
  font-size: 0.75rem; letter-spacing: 0.03em; margin-bottom: 10px;
}
.trial-kind-badge.anti { background: #2a1608; color: #fb923c; border: 1px solid #7c3410; }
.trial-kind-badge.toward { background: #0f172a; color: #7dd3fc; border: 1px solid #164e63; }
.trial-kind-badge.rescue { background: #0f2918; color: #4ade80; border: 1px solid #166534; }

.report-section-title {
  font-size: 0.8rem; font-weight: 700; color: #d1d5db; margin: 28px 0 4px;
}
.report-section-hint { font-size: 0.78rem; color: #6b7280; margin-bottom: 14px; }

.reset-btn {
  font-size: 0.75rem; color: #9ca3af; background: #1a1d2e; border: 1px solid #2a2d3e;
  border-radius: 6px; padding: 4px 12px; cursor: pointer; transition: all 0.15s;
  display: block; margin: 10px auto 0;
}
.reset-btn:hover { border-color: #ef4444; color: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>你更愿意读哪一个？</h1>
    <p>新架构 — 与你的信息流采用相同的帖子选择与改写方向，盲测呈现。</p>
    <button class="reset-btn" onclick="resetSession()">↺ 重置会话</button>
  </div>

  <p class="instruction">点击你更愿意阅读的那一个。</p>

  <div id="trial-container"><div class="loading">正在加载第一组…</div></div>
</div>

<script>
const API = '';
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session');
// Dev mode is permanently off in the Chinese version -- no toggle exists.
const devMode = false;
let currentTrial = null;
let choosing = false;

const AXIS_ZH = {
  reading_level: '阅读难度', concreteness: '具体性', narrativity: '叙事性',
  hedging: '委婉程度', tone: '语气', warmth: '温暖度',
  self_disclosure: '自我表露', casualness: '随意程度', humor: '幽默感',
};
const TOPIC_ZH = {
  'AI & Tech': '人工智能与科技', 'Ancient History': '古代历史',
  'Birds & Nature': '鸟类与自然', 'Books & Reading': '书籍与阅读',
  'Climate & Energy': '气候与能源', 'Economy & Jobs': '经济与就业',
  'Fitness & Gym': '健身', 'Food & Cooking': '美食与烹饪',
  'Gardening & Plants': '园艺与植物', 'Higher Education': '高等教育',
  'Movies & Film': '电影', 'Music': '音乐', 'Pets': '宠物',
  'Photography': '摄影', 'Politics': '政治',
  'Space & Astronomy': '太空与天文', 'Sports': '体育',
  'Transportation & Urbanism': '交通与城市规划', 'Video Games': '电子游戏',
};
function axisZh(ax) { return AXIS_ZH[ax] || ax.replace(/_/g, ' '); }
function topicZh(t) { return TOPIC_ZH[t] || t; }

// Batch-translate free-form text via the backend. Generation and the
// classifier/BERTScore verification gate all still ran in English on the
// server -- this only translates what gets displayed. Falls back to the
// English original on any failure so a translation hiccup never blocks
// the eval flow.
async function translateBatch(texts) {
  if (!texts.length) return texts;
  try {
    const res = await fetch(`${API}/api/translate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texts }),
    });
    if (!res.ok) return texts;
    const data = await res.json();
    return data.translations && data.translations.length === texts.length ? data.translations : texts;
  } catch (e) {
    return texts;
  }
}

// Generating + verifying a rewrite involves real LLM calls and can take
// 15-50s, plus translation on top of that here. Show elapsed time so the
// page doesn't look frozen, and give up client-side after 2 minutes.
const LOAD_TIMEOUT_MS = 120000;

if (!sessionId) {
  document.getElementById('trial-container').innerHTML =
    '<div class="loading">未提供会话 ID。<br><br>请先完成<a href="/index_zh.html" style="color:#8b5cf6">种子会话</a>。</div>';
} else {
  loadNext();
}

async function loadNext() {
  const container = document.getElementById('trial-container');
  const startedAt = Date.now();
  container.innerHTML = '<div class="loading">正在生成改写版本… <span id="elapsed">0s</span><br><small style="color:#4b5563">此转换过程大约需要 30 秒。</small></div>';
  const tick = setInterval(() => {
    const el = document.getElementById('elapsed');
    if (el) el.textContent = `${Math.floor((Date.now() - startedAt) / 1000)}s`;
  }, 1000);

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), LOAD_TIMEOUT_MS);

  let res;
  try {
    res = await fetchWithRetry(`${API}/api/eval/next`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
      signal: controller.signal,
    });
  } catch (e) {
    clearInterval(tick);
    clearTimeout(timeoutId);
    const msg = e.name === 'AbortError'
      ? '等待改写版本超时。<button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button>'
      : `网络错误：${escapeHtml(String(e))} <button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button>`;
    container.innerHTML = `<div class="loading">${msg}</div>`;
    document.getElementById('retry-btn').addEventListener('click', loadNext);
    return;
  }
  clearInterval(tick);
  clearTimeout(timeoutId);

  if (!res.ok) {
    const err = await friendlyErrorZh(res);
    container.innerHTML = `<div class="loading">${escapeHtml(err)} <button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', loadNext);
    return;
  }
  currentTrial = await res.json();
  choosing = false;

  if (currentTrial.done) {
    showReport();
    return;
  }
  await renderTrial(currentTrial);
}

async function renderTrial(trial) {
  const container = document.getElementById('trial-container');
  container.innerHTML = '<div class="loading">翻译中…</div>';

  const [leftZh, rightZh] = await translateBatch([trial.left_text, trial.right_text]);

  container.innerHTML = '';

  const progress = document.createElement('div');
  progress.className = 'progress';
  progress.textContent = `第 ${trial.trials_completed + 1} 组，共 ${trial.trials_total} 组`;
  container.appendChild(progress);

  const topicTag = document.createElement('div');
  topicTag.style.textAlign = 'center';
  topicTag.innerHTML = `<span class="topic-tag">${topicZh(trial.topic_name)}</span>`;
  container.appendChild(topicTag);

  const comparison = document.createElement('div');
  comparison.className = 'comparison';

  const leftPanel = document.createElement('div');
  leftPanel.className = 'panel';
  leftPanel.textContent = leftZh;
  leftPanel.addEventListener('click', () => choose('left'));

  const rightPanel = document.createElement('div');
  rightPanel.className = 'panel';
  rightPanel.textContent = rightZh;
  rightPanel.addEventListener('click', () => choose('right'));

  if (devMode) {
    if (trial.rewrite_side === 'left') leftPanel.classList.add('chosen');
    if (trial.rewrite_side === 'right') rightPanel.classList.add('chosen');
  }

  comparison.appendChild(leftPanel);
  comparison.appendChild(rightPanel);
  container.appendChild(comparison);

  if (devMode) {
    container.appendChild(buildDevPanel(trial));
  }
}

function trialKindBadgeHtml(trial) {
  if (trial.trial_kind === 'anti_preference') {
    return `<div class="trial-kind-badge anti">⇄ 双向检验 — 这篇是你已经喜欢的帖子，被刻意推向偏离你偏好的方向</div>`;
  }
  if (trial.trial_kind === 'rescue') {
    return `<div class="trial-kind-badge rescue">↺ 挽救检验 — 这篇是你在种子会话中跳过的帖子，被推向你的偏好方向</div>`;
  }
  return `<div class="trial-kind-badge toward">→ 标准试验 — 被推向你的偏好方向</div>`;
}

function buildDevPanel(trial) {
  const panel = document.createElement('div');
  panel.className = 'dev-panel open';

  if (!trial.rewrite_succeeded) {
    panel.innerHTML = `
      ${trialKindBadgeHtml(trial)}
      <div class="dev-section-title">改写所在侧</div>
      <span class="side-badge">${trial.rewrite_side === 'left' ? '左' : '右'}</span>
      <span style="color:#fbbf24;">改写在 ${trial.attempts || 0} 次尝试后被拒绝 — 这一侧实际上是未经修改的原文。</span>`;
    return panel;
  }

  const sv = trial.style_verification;
  const targetAxes = new Set(Object.keys(trial.deltas || {}));

  let html = `${trialKindBadgeHtml(trial)}
    <div class="dev-section-title">改写所在侧</div>
    <span class="side-badge">${trial.rewrite_side === 'left' ? '左' : '右'}</span>`;

  if (sv) {
    const cls = sv.verdict === 'clean' ? 'clean' : 'leaked';
    const icon = sv.verdict === 'clean' ? '✓' : '⚠';
    const verdictZh = sv.verdict === 'clean' ? '干净通过' : '存在泄漏';
    html += ` <span class="verdict ${cls}">${icon} ${verdictZh} · 内容相似度（BGE 余弦相似度）${sv.bge_cosine.toFixed(3)}</span>`;
  }

  html += `<div class="dev-section-title">目标维度与方向</div>`;
  for (const [ax, d] of Object.entries(trial.deltas || {})) {
    const dirZh = d.direction === 'increase' ? '增加' : '减少';
    html += `<div class="attempts-row"><b style="color:#a78bfa">${axisZh(ax)}</b>：${dirZh}（从 ${d.current.toFixed(2)} 到 ${d.target.toFixed(2)}）</div>`;
  }

  if (sv && sv.axis_shifts) {
    html += `<div class="dev-section-title">每个维度的变化量（分类器打分）</div><table class="axis-table">`;
    for (const [ax, v] of Object.entries(sv.axis_shifts)) {
      const isTarget = targetAxes.has(ax);
      html += `<tr class="${isTarget ? 'target' : ''}"><td>${axisZh(ax)}</td><td>${v >= 0 ? '+' : ''}${v.toFixed(4)}</td></tr>`;
    }
    html += `</table>`;
  }

  if (trial.attempts_log && trial.attempts_log.length > 1) {
    html += `<div class="dev-section-title">尝试记录（拒绝后重试）</div>`;
    for (const a of trial.attempts_log) {
      const verdictZh = a.verdict === 'clean' ? '干净通过' : '存在泄漏';
      html += `<div class="attempts-row">第 ${a.attempt} 次尝试（温度 ${a.temperature}）：${verdictZh} · 目标变化=${a.min_target_shift.toFixed(3)} 其他变化=${a.max_other_shift.toFixed(3)} bge_cosine=${a.bge_cosine.toFixed(3)}</div>`;
    }
  }

  panel.innerHTML = html;
  return panel;
}

async function choose(side) {
  if (choosing || !currentTrial) return;
  choosing = true;

  const container = document.getElementById('trial-container');
  let res;
  try {
    res = await fetchWithRetry(`${API}/api/eval/choice`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, post_id: currentTrial.post_id, chosen_side: side }),
    });
  } catch (e) {
    choosing = false;
    container.innerHTML = `<div class="loading">网络错误，请重试。 <button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', () => choose(side));
    return;
  }

  if (!res.ok) {
    choosing = false;
    const err = await friendlyErrorZh(res);
    container.innerHTML = `<div class="loading">${escapeHtml(err)} <button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', () => choose(side));
    return;
  }

  const data = await res.json();

  if (data.trials_completed >= data.trials_total) {
    showReport();
  } else {
    loadNext();
  }
}

async function showReport() {
  const container = document.getElementById('trial-container');
  container.innerHTML = '<div class="loading">正在加载报告…</div>';

  let res;
  try {
    res = await fetchWithRetry(`${API}/api/eval/results/${sessionId}`, {});
  } catch (e) {
    container.innerHTML = `<div class="loading">网络错误，请重试。 <button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', showReport);
    return;
  }
  if (!res.ok) {
    container.innerHTML = `<div class="loading">${escapeHtml(await friendlyErrorZh(res))} <button id="retry-btn" style="margin-left:8px;cursor:pointer;">重试</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', showReport);
    return;
  }
  const data = await res.json();
  const stats = data.stats;

  if (!stats) {
    container.innerHTML = '<div class="loading">评估已完成，但没有记录到任何选择。</div>';
    return;
  }

  const toward = stats.toward_preference;
  const anti = stats.anti_preference;
  const rescue = stats.rescue;

  const axisTableHtml = (byAxis, valueLabel) => {
    const rows = Object.entries(byAxis)
      .sort((a, b) => b[1].win_rate - a[1].win_rate)
      .map(([ax, v]) => `
        <tr>
          <td>${axisZh(ax)}</td>
          <td>${v.total}</td>
          <td>
            <div class="win-rate-bar-wrap">
              <div class="win-rate-bar"><div class="win-rate-bar-fill" style="width:${Math.round(v.win_rate * 100)}%"></div></div>
              <span class="win-rate-value">${Math.round(v.win_rate * 100)}%</span>
            </div>
          </td>
        </tr>`).join('');
    return `<table class="axis-report-table">
      <thead><tr><th>目标维度</th><th>试验次数</th><th>${valueLabel}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  };

  let html = `<div class="report"><h2>评估完成</h2>
    <p class="subtitle">共 ${stats.total_trials} 组试验</p>`;

  if (toward) {
    const pct = Math.round(toward.rewrite_win_rate * 100);
    html += `
      <div class="report-headline">
        <div class="big-number ${pct < 50 ? 'low' : ''}">${pct}%</div>
        <div class="caption">在 ${toward.n} 组标准试验中，你选择了被推向你偏好方向的版本</div>
      </div>
      ${axisTableHtml(toward.by_axis, '更偏好改写版本')}`;
  }

  if (anti) {
    const origPct = Math.round(anti.original_preferred_rate * 100);
    html += `
      <div class="report-section-title">双向检验</div>
      <p class="report-section-hint">这 ${anti.n} 组试验取了一篇你已经喜欢的帖子，并刻意将其推向偏离你偏好的方向。如果个性化推荐真的有效，你应该更偏好这里未经改动的原文 — 与上面的标准试验相反。</p>
      <div class="report-headline">
        <div class="big-number ${origPct < 50 ? 'low' : ''}">${origPct}%</div>
        <div class="caption">的情况下，你正确地偏好了未经改动的原文，而不是被劣化的版本</div>
      </div>
      ${axisTableHtml(anti.by_axis, '更偏好被劣化的版本')}`;
  } else {
    html += `<div class="report-section-title">双向检验</div>
      <p class="report-section-hint">本次会话未生成双向检验试验（可供劣化的已喜欢帖子不足）。</p>`;
  }

  if (rescue) {
    const pct = Math.round(rescue.rewrite_win_rate * 100);
    html += `
      <div class="report-section-title">挽救检验</div>
      <p class="report-section-hint">这 ${rescue.n} 组试验取了一篇你在种子会话中跳过的帖子，并将其推向你的偏好方向，用来测试改写能否把一次"跳过"变成一次"选中"。</p>
      <div class="report-headline">
        <div class="big-number ${pct < 50 ? 'low' : ''}">${pct}%</div>
        <div class="caption">的情况下，改写成功挽救了一篇你原本跳过的帖子</div>
      </div>
      ${axisTableHtml(rescue.by_axis, '更偏好改写版本')}`;
  } else {
    html += `<div class="report-section-title">挽救检验</div>
      <p class="report-section-hint">本次会话未生成挽救检验试验（可供改写的已跳过帖子不足）。</p>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Extracts the friendly `detail` message from a JSON error body (backend
// error messages are always in English), then translates it for display
// since this is the Chinese version. Falls back to the raw response text,
// then to the English message untranslated, if either step fails.
async function friendlyErrorZh(res) {
  const raw = await res.text();
  let msg = raw;
  try {
    const parsed = JSON.parse(raw);
    if (typeof parsed.detail === 'string') msg = parsed.detail;
  } catch (e) {}
  try {
    const [translated] = await translateBatch([msg]);
    return translated || msg;
  } catch (e) {
    return msg;
  }
}

// 422 in this app is only ever raised by the app-wide RequestValidationError
// handler (see backend/app_v2.py) -- never a real 4xx/5xx business error
// (those use 400/404/502). Most of the time that means a transient
// tunnel/proxy hiccup dropping a request body, so retrying a couple times
// before surfacing anything to the user is safe. It won't help if the 422
// is actually deterministic (e.g. a route wired to the wrong handler) --
// that still needs a real backend fix, this only smooths over genuine
// one-off blips.
async function fetchWithRetry(url, options, maxRetries = 2, retryDelayMs = 600) {
  for (let attempt = 0; ; attempt++) {
    try {
      const res = await fetch(url, options);
      if (res.status !== 422 || attempt === maxRetries) return res;
    } catch (e) {
      if ((options.signal && options.signal.aborted) || attempt === maxRetries) throw e;
    }
    await new Promise(r => setTimeout(r, retryDelayMs));
  }
}

function resetSession() {
  if (!confirm('重置此会话并从主题选择重新开始？当前进度将丢失。')) return;
  window.location.href = '/index_zh.html';
}
</script>
