<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自适应内容呈现 — 种子会话</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", 'Segoe UI', system-ui, sans-serif;
  background: #0f1117; color: #e8eaf0;
  min-height: 100vh; padding: 32px 16px;
  display: flex; flex-direction: column; align-items: center;
}

.container { width: 100%; max-width: 1100px; }

/* Header */
.header {
  text-align: center; margin-bottom: 32px;
}
.header h1 { font-size: 1.6rem; color: #d1d5db; margin-bottom: 4px; }
.header p { font-size: 0.85rem; color: #6b7280; }

/* Progress */
.progress-wrap {
  width: 100%; background: #1e2130; border-radius: 999px;
  height: 5px; margin-bottom: 16px;
}
.progress-bar {
  height: 100%; background: #4b5563;
  border-radius: 999px; transition: width 0.4s;
}

/* Status */
.status {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; font-size: 0.8rem; color: #6b7280;
}
.status .step { color: #d1d5db; font-weight: 600; }

/* Instruction */
.instruction {
  text-align: center; margin-bottom: 24px;
}
.instruction h2 { font-size: 1.15rem; color: #e8eaf0; margin-bottom: 6px; }
.instruction p { font-size: 0.85rem; color: #9ca3af; }

/* Post grid — shelf mode */
.post-grid {
  display: grid; gap: 14px; margin-bottom: 32px;
}
.post-grid.shelf {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.post-grid.pair {
  grid-template-columns: 1fr 1fr;
}

/* Post card */
.post-card {
  background: #1a1d2e; border: 2px solid #2a2d3e; border-radius: 14px;
  padding: 20px; cursor: pointer; transition: all 0.15s;
  line-height: 1.65; font-size: 0.9rem; color: #d1d5db;
  position: relative; min-height: 140px;
}
.post-card:hover { border-color: #4b5563; background: #1c1f2e; transform: translateY(-2px); }
.post-card.selected { border-color: #22c55e; background: #0f2918; }
.post-card .topic-tag {
  display: inline-block; font-size: 0.7rem; font-weight: 600;
  color: #9ca3af; background: #1f2937; border-radius: 6px;
  padding: 2px 8px; margin-bottom: 10px;
  letter-spacing: 0.04em;
}
.post-card .text { white-space: pre-wrap; word-break: break-word; }

/* Confirm button */
.confirm-wrap { text-align: center; margin-bottom: 32px; }
.confirm-btn {
  padding: 14px 48px; border-radius: 12px; border: none;
  background: #374151; color: white;
  font-size: 1rem; font-weight: 700; cursor: pointer;
  opacity: 0.4; pointer-events: none; transition: opacity 0.2s;
}
.confirm-btn.active { opacity: 1; pointer-events: auto; }

/* Profile panel */
.profile-panel {
  background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 14px;
  padding: 20px; margin-top: 24px;
}
.profile-panel h3 { font-size: 0.9rem; color: #d1d5db; margin-bottom: 12px; }
.profile-section { margin-bottom: 14px; }
.profile-section label {
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.06em; color: #6b7280; display: block; margin-bottom: 4px;
}
.profile-section .value {
  font-size: 0.85rem; color: #d1d5db; line-height: 1.5;
}

/* Confidence bars */
.conf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.conf-item { display: flex; align-items: center; gap: 8px; }
.conf-item .label { font-size: 0.75rem; color: #9ca3af; min-width: 110px; }
.conf-item .bar-bg {
  flex: 1; height: 6px; background: #2a2d3e; border-radius: 3px; overflow: hidden;
}
.conf-item .bar-fill {
  height: 100%; background: #4b5563; border-radius: 3px; transition: width 0.4s;
}

/* Complete screen */
.complete { text-align: center; padding: 40px 0; }
.complete h2 { font-size: 1.4rem; color: #22c55e; margin-bottom: 12px; }
.complete .download-btn {
  padding: 14px 36px; border-radius: 12px; border: none;
  background: #374151; color: white;
  font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 20px;
}

/* Hidden */
.hidden { display: none; }

/* Topic picker */
.topic-grid {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  margin-bottom: 32px; max-width: 720px; margin-left: auto; margin-right: auto;
}
.topic-chip {
  padding: 10px 18px; border-radius: 999px; border: 2px solid #2a2d3e;
  background: #1a1d2e; color: #d1d5db; font-size: 0.88rem; cursor: pointer;
  transition: all 0.15s; user-select: none;
}
.topic-chip:hover { border-color: #4b5563; }
.topic-chip.selected { border-color: #22c55e; background: #0f2918; color: #e8eaf0; }
.topic-grid.hidden { display: none; }

/* Per-post axis labels (pair mode, dev-only) */
.axis-label-row {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2d3e;
}
.axis-label-chip {
  font-size: 0.65rem; color: #9ca3af; background: #12141f;
  border-radius: 4px; padding: 2px 6px; font-variant-numeric: tabular-nums;
}

/* Confidence / style-preference evolution (dev-only) */
.evo-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.evo-row .evo-label { font-size: 0.72rem; color: #9ca3af; min-width: 100px; }
.evo-value { font-size: 0.75rem; color: #d1d5db; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

.reset-btn {
  font-size: 0.75rem; color: #9ca3af; background: #1a1d2e; border: 1px solid #2a2d3e;
  border-radius: 6px; padding: 4px 12px; cursor: pointer; transition: all 0.15s;
}
.reset-btn:hover { border-color: #ef4444; color: #ef4444; }

.translating-note { text-align: center; color: #6b7280; font-size: 0.85rem; padding: 20px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>自适应内容呈现</h1>
    <p>了解你的阅读风格偏好 — 中文测试版</p>
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap;">
      <button class="reset-btn" id="reset-btn" onclick="resetSession()">↺ 重置会话</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

  <div class="status dev-only">
    <span class="step" id="step-label">正在加载...</span>
    <span id="mode-label"></span>
  </div>

  <div class="instruction" id="instruction">
    <h2 id="instr-title">选择你感兴趣的帖子</h2>
    <p id="instr-hint">点击任何吸引你的帖子，然后确认。</p>
  </div>

  <!-- Topic picker -->
  <div class="topic-grid hidden" id="topic-grid"></div>

  <div class="post-grid shelf" id="post-grid"></div>

  <div class="confirm-wrap">
    <button class="confirm-btn" id="confirm-btn" onclick="confirmChoices()">
      确认选择 →
    </button>
  </div>

  <!-- Profile (dev-only, shown after first interaction) -->
  <div class="profile-panel hidden dev-only" id="profile-panel">
    <h3>你的动态画像</h3>
    <div class="profile-section">
      <label>主题</label>
      <div class="value" id="profile-topics">—</div>
    </div>
    <div class="profile-section">
      <label>风格偏好</label>
      <div class="value" id="profile-style">—</div>
    </div>
    <div class="profile-section">
      <label>置信度</label>
      <div class="conf-grid" id="conf-grid"></div>
    </div>
    <div class="profile-section">
      <label>置信度随时间变化（每个维度）</label>
      <div id="confidence-evolution"></div>
    </div>
    <div class="profile-section">
      <label>风格偏好随时间变化（每个维度）</label>
      <div id="style-evolution"></div>
    </div>
  </div>

  <!-- Complete screen -->
  <div class="complete hidden" id="complete-screen">
    <h2>✓ 画像已完成</h2>
    <p>我们已经充分了解了你的偏好。</p>
    <div class="profile-panel" id="final-profile"></div>
    <button class="download-btn" onclick="downloadProfile()">⬇ 下载画像数据</button>
  </div>
</div>

<script>
const API = '';  // same origin
let sessionId = null;
let currentPosts = [];
let selectedIds = new Set();
// Dev mode is permanently off in the Chinese version -- no toggle, no
// ?dev=1 URL bypass. This constant never changes.
const DEV_MODE = false;

// Hardcoded translation tables for the fixed sets of axis/topic names --
// these never change, so there's no need to call the translation API for
// them. Only free-form post/rewrite text (which varies per post) goes
// through /api/translate. Falls back to the English original if a lookup
// misses, so nothing ever silently disappears.
const AXIS_ZH = {
  reading_level: '阅读难度', concreteness: '具体性', narrativity: '叙事性',
  hedging: '委婉程度', tone: '语气', warmth: '温暖度',
  self_disclosure: '自我表露', casualness: '随意程度', humor: '幽默感',
};
const TOPIC_ZH = {
  'AI & Tech': '人工智能与科技', 'Ancient History': '古代历史',
  'Birds & Nature': '鸟类与自然', 'Books & Reading': '书籍与阅读',
  'Climate & Energy': '气候与能源', 'Economy & Jobs': '经济与就业',
  'Fitness & Gym': '健身', 'Food & Cooking': '美食与烹饪',
  'Gardening & Plants': '园艺与植物', 'Higher Education': '高等教育',
  'Movies & Film': '电影', 'Music': '音乐', 'Pets': '宠物',
  'Photography': '摄影', 'Politics': '政治',
  'Space & Astronomy': '太空与天文', 'Sports': '体育',
  'Transportation & Urbanism': '交通与城市规划', 'Video Games': '电子游戏',
};
function axisZh(ax) { return AXIS_ZH[ax] || ax.replace(/_/g, ' '); }
function topicZh(t) { return TOPIC_ZH[t] || t; }

// Batch-translate free-form text via the backend (English generation +
// verification stay untouched -- this only affects what gets displayed).
// Falls back to the original English text if the call fails, so a
// translation hiccup never blocks the session.
async function translateBatch(texts) {
  if (!texts.length) return texts;
  try {
    const res = await fetch(`${API}/api/translate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texts }),
    });
    if (!res.ok) return texts;
    const data = await res.json();
    return data.translations && data.translations.length === texts.length ? data.translations : texts;
  } catch (e) {
    return texts;
  }
}

// Which backend architecture is this? /health only includes an
// "architecture" field on the v2 (no-LLM-profile) app.
let isV2Architecture = false;
async function detectArchitecture() {
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    isV2Architecture = Boolean(data.architecture);
  } catch (e) {
    isV2Architecture = false;
  }
}

const AXIS_ORDER = ['reading_level', 'concreteness', 'narrativity', 'hedging',
                     'tone', 'warmth', 'self_disclosure', 'casualness', 'humor'];
let confidenceHistory = [];
let stylePrefsHistory = [];  // FILTERED (top-4 + neutral-band) -- what rewriting actually uses
let allStylePrefsHistory = [];  // UNFILTERED -- raw preferred_value for every axis, for the evolution chart

applyDevMode();

let lastProfile = null, lastConfidence = null, lastStylePrefs = null;

function applyDevMode() {
  document.querySelectorAll('.dev-only').forEach(el => {
    el.style.display = DEV_MODE ? '' : 'none';
  });
}

// ── Start ────────────────────────────────────────────────────────
const MIN_TOPICS_REQUIRED = 2;
let selectedTopics = new Set();

async function startSession() {
  document.getElementById('step-label').textContent = '正在加载…';
  // ?variant=short: shortened Chinese demo flow -- 6 seeding rounds instead
  // of 11, and a 6-trial, all-standard eval (no bidirectional/rescue
  // trials). Configured entirely server-side per session; the English flow
  // (index.html) never passes this and is completely unaffected.
  const res = await fetch(`${API}/api/session/start?variant=short`, { method: 'POST' });
  const data = await res.json();
  sessionId = data.session_id;

  if (data.needs_topic_selection) {
    renderTopicPicker(data.available_topics);
    return;
  }

  document.getElementById('step-label').textContent = '第 1 步';
  renderPosts(data.posts, data.action);
}

// ── Topic picker ──────────────────────────────────────
function renderTopicPicker(topics) {
  document.getElementById('step-label').textContent = '选择你的主题';
  document.getElementById('mode-label').textContent = '模式 A：主题选择';
  document.getElementById('instr-title').textContent = '你对哪些主题感兴趣？';
  document.getElementById('instr-hint').textContent = `至少选择 ${MIN_TOPICS_REQUIRED} 个 — 这样就不用从帖子中猜测你的兴趣了。`;

  document.getElementById('post-grid').classList.add('hidden');
  const grid = document.getElementById('topic-grid');
  grid.classList.remove('hidden');
  grid.innerHTML = '';
  selectedTopics.clear();
  updateConfirmBtn();

  topics.forEach(topic => {
    const chip = document.createElement('div');
    chip.className = 'topic-chip';
    chip.textContent = topicZh(topic);
    chip.onclick = () => {
      if (selectedTopics.has(topic)) {
        selectedTopics.delete(topic);
        chip.classList.remove('selected');
      } else {
        selectedTopics.add(topic);
        chip.classList.add('selected');
      }
      const btn = document.getElementById('confirm-btn');
      btn.classList.toggle('active', selectedTopics.size >= MIN_TOPICS_REQUIRED);
    };
    grid.appendChild(chip);
  });

  const btn = document.getElementById('confirm-btn');
  btn.textContent = '继续 →';
  btn.onclick = confirmTopics;
}

async function confirmTopics() {
  if (selectedTopics.size < MIN_TOPICS_REQUIRED) return;

  const btn = document.getElementById('confirm-btn');
  btn.textContent = '正在更新...';
  btn.classList.remove('active');

  const res = await fetch(`${API}/api/session/choose-topics`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, topics: [...selectedTopics] }),
  });
  const data = await res.json();

  updateProfilePanel(data.profile, data.confidence, data.style_prefs, data.all_style_prefs);
  updateProgress(data);

  document.getElementById('topic-grid').classList.add('hidden');
  document.getElementById('post-grid').classList.remove('hidden');
  btn.textContent = '确认选择 →';
  btn.onclick = confirmChoices;

  if (data.is_complete) {
    showComplete(data);
    return;
  }
  document.getElementById('step-label').textContent = '第 2 步';
  renderPosts(data.posts, data.action);
}

// ── Render posts ─────────────────────────────────────────────────
async function renderPosts(posts, action) {
  currentPosts = posts;
  selectedIds.clear();
  updateConfirmBtn();

  const grid = document.getElementById('post-grid');
  grid.className = `post-grid ${action.mode === 'pair' ? 'pair' : 'shelf'}`;
  grid.innerHTML = '<div class="translating-note">翻译中…</div>';

  if (action.mode === 'pair') {
    document.getElementById('instr-title').textContent = '选择你更愿意阅读的那一个。';
    document.getElementById('instr-hint').textContent = '';
    document.getElementById('mode-label').textContent =
      `模式 B — 正在探测：${axisZh(action.target_axis)}`;
  } else {
    document.getElementById('instr-title').textContent = '点击任何吸引你的帖子。';
    document.getElementById('instr-hint').textContent = '';
    document.getElementById('mode-label').textContent = '模式 A：主题探索';
  }

  const translations = await translateBatch(posts.map(p => p.text));

  grid.innerHTML = '';
  posts.forEach((post, i) => {
    const card = document.createElement('div');
    card.className = 'post-card';
    card.dataset.id = post.post_id;
    const topicHtml = DEV_MODE
      ? `<span class="topic-tag">${topicZh(post.topic_name)}</span>`
      : '';
    const axisHtml = (DEV_MODE && action.mode === 'pair') ? axisLabelHtml(post.axes) : '';
    card.innerHTML = `
      ${topicHtml}
      <div class="text">${escapeHtml(translations[i])}</div>
      ${axisHtml}
    `;
    card.onclick = () => toggleCard(card, post.post_id, action.mode);
    grid.appendChild(card);
  });
}

function axisLabelHtml(axes) {
  if (!axes) return '';
  const chips = AXIS_ORDER.map(ax => {
    const raw = axes[ax];
    const v = raw && typeof raw === 'object' ? raw.score : raw;
    if (v === undefined || v === null) return '';
    return `<span class="axis-label-chip">${axisZh(ax)}：${Number(v).toFixed(2)}</span>`;
  }).join('');
  return `<div class="axis-label-row">${chips}</div>`;
}

function toggleCard(card, postId, mode) {
  if (mode === 'pair') {
    document.querySelectorAll('.post-card').forEach(c => c.classList.remove('selected'));
    selectedIds.clear();
    selectedIds.add(postId);
    card.classList.add('selected');
  } else {
    if (selectedIds.has(postId)) {
      selectedIds.delete(postId);
      card.classList.remove('selected');
    } else {
      selectedIds.add(postId);
      card.classList.add('selected');
    }
  }
  updateConfirmBtn();
}

function updateConfirmBtn() {
  const btn = document.getElementById('confirm-btn');
  btn.classList.toggle('active', selectedIds.size > 0);
}

// ── Confirm & interact ───────────────────────────────────────────
async function confirmChoices() {
  if (selectedIds.size === 0) return;

  const btn = document.getElementById('confirm-btn');
  btn.textContent = '正在更新...';
  btn.classList.remove('active');

  const allShownIds = currentPosts.map(p => p.post_id);

  const res = await fetch(`${API}/api/session/interact`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      session_id: sessionId,
      chosen_post_ids: [...selectedIds],
      shown_post_ids: allShownIds,
    }),
  });
  const data = await res.json();

  updateProfilePanel(data.profile, data.confidence, data.style_prefs, data.all_style_prefs);
  updateProgress(data);

  if (data.is_complete) {
    showComplete(data);
    return;
  }

  btn.textContent = '确认选择 →';
  renderPosts(data.posts, data.action);
}

// ── Profile panel ────────────────────────────────────────────────
function styleObjectsSummary(stylePrefs) {
  if (!stylePrefs || Object.keys(stylePrefs).length === 0) return '—（置信度尚不足）';
  return Object.entries(stylePrefs)
    .map(([ax, val]) => `${axisZh(ax)}：${val > 0.5 ? '偏多' : '偏少'}（${val.toFixed(2)}）`)
    .join('，');
}

// profile.topics_prose only exists on the LLM-profile (v1) architecture --
// v2 has no LLM prose at all, so fall back to the real topic confidence
// data (set to full confidence the moment the user picks a topic).
function topicsSummary(confidence) {
  const topics = Object.keys(confidence?.topics || {});
  if (!topics.length) return '—（未记录主题）';
  return topics.map(t => topicZh(t)).join('，');
}

function updateProfilePanel(profile, confidence, stylePrefs, allStylePrefs) {
  lastProfile = profile; lastConfidence = confidence; lastStylePrefs = stylePrefs;
  confidenceHistory.push({ ...(confidence?.axes || {}) });
  stylePrefsHistory.push({ ...(stylePrefs || {}) });
  allStylePrefsHistory.push({ ...(allStylePrefs || {}) });

  if (!DEV_MODE) return;
  renderProfilePanelDisplay();
}

function renderProfilePanelDisplay() {
  const panel = document.getElementById('profile-panel');
  panel.classList.remove('hidden');

  document.getElementById('profile-topics').textContent = lastProfile?.topics_prose || topicsSummary(lastConfidence);
  document.getElementById('profile-style').textContent = lastProfile?.style_prose || styleObjectsSummary(lastStylePrefs);

  const confGrid = document.getElementById('conf-grid');
  confGrid.innerHTML = '';

  for (const [topic, conf] of Object.entries(lastConfidence?.topics || {})) {
    confGrid.innerHTML += confItem(topicZh(topic), conf);
  }
  for (const [axis, conf] of Object.entries(lastConfidence?.axes || {})) {
    confGrid.innerHTML += confItem(axisZh(axis), conf);
  }

  renderEvolutionPanel();
}

function renderEvolutionPanel() {
  renderEvoGrid('confidence-evolution', confidenceHistory, 'confidence');
  // allStylePrefsHistory is UNFILTERED -- shows every axis's raw preferred
  // value, not just the top-4 + neutral-band-filtered subset actually used
  // for rewriting. activeAxes marks which ones ARE currently in that
  // filtered set, so it's still visible which axes are live vs. just
  // tracked for visibility.
  const activeAxes = new Set(Object.keys(lastStylePrefs || {}));
  renderEvoGrid('style-evolution', allStylePrefsHistory, 'style', activeAxes);
}

function renderEvoGrid(containerId, history, kind, activeAxes) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  AXIS_ORDER.forEach(ax => {
    const values = history.map(round => round[ax]);
    // Summary number = the CURRENT (most recent) round only, not backfilled
    // from an earlier round the axis happened to have a value in -- see the
    // matching comment in index.html's renderEvoGrid() for why that matters.
    const current = values[values.length - 1];

    // Mark axes currently in the FILTERED style_prefs (top-4 + non-neutral)
    // -- i.e. actually live for rewriting right now.
    const isActive = kind === 'style' && activeAxes && activeAxes.has(ax);

    const row = document.createElement('div');
    row.className = 'evo-row';
    row.innerHTML = `
      <span class="evo-label">${isActive ? '● ' : ''}${axisZh(ax)}</span>
      <span class="evo-value" style="${isActive ? 'color:#c4b5fd;font-weight:700;' : ''}">${current !== undefined ? current.toFixed(2) : '—'}</span>
    `;
    container.appendChild(row);
  });
}

function confItem(label, value) {
  const pct = Math.round(value * 100);
  return `<div class="conf-item">
    <span class="label">${label}</span>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function updateProgress(data) {
  const step = data.confidence ? Object.keys(data.confidence.topics || {}).length : 0;
  document.getElementById('step-label').textContent = `第 ${step + 1} 步`;
  const axes = Object.values(data.confidence?.axes || {});
  const avgConf = axes.length ? axes.reduce((a, b) => a + b, 0) / axes.length : 0;
  document.getElementById('progress-bar').style.width = `${Math.round(avgConf * 100)}%`;
}

// ── Complete ─────────────────────────────────────────────────────
function showComplete(data) {
  document.getElementById('post-grid').classList.add('hidden');
  document.getElementById('confirm-btn').classList.add('hidden');
  document.getElementById('instruction').classList.add('hidden');

  const screen = document.getElementById('complete-screen');
  screen.classList.remove('hidden');
  screen.querySelectorAll('.dynamic-action-btn').forEach(el => el.remove());
  screen.querySelector('.profile-panel').innerHTML = `
    <h3>最终画像</h3>
    <div class="profile-section"><label>主题</label>
      <div class="value">${data.profile?.topics_prose || topicsSummary(data.confidence)}</div></div>
    <div class="profile-section"><label>风格</label>
      <div class="value">${data.profile?.style_prose || styleObjectsSummary(data.style_prefs)}</div></div>
  `;

  const evalBtn = document.createElement('button');
  evalBtn.className = 'download-btn dynamic-action-btn';
  evalBtn.style.marginTop = '12px';
  evalBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
  evalBtn.textContent = '→ 开始评估';
  evalBtn.onclick = () => {
    if (isV2Architecture) {
      fetch('/api/eval/prewarm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      }).catch(() => {});
    }
    const page = isV2Architecture ? 'eval_v2_zh.html' : 'eval.html';
    window.location.href = `/${page}?session=${sessionId}`;
  };
  screen.appendChild(evalBtn);

  if (!isV2Architecture) {
    const feedBtn = document.createElement('button');
    feedBtn.className = 'download-btn dynamic-action-btn';
    feedBtn.style.cssText = 'margin-top:8px; background:linear-gradient(135deg,#7c3aed,#4f46e5);';
    feedBtn.textContent = '→ 查看你的信息流';
    feedBtn.onclick = () => { window.location.href = `/feed.html?session=${sessionId}`; };
    screen.appendChild(feedBtn);
  }
}

function resetSession() {
  if (!confirm('重置此会话并从主题选择重新开始？当前进度将丢失。')) return;

  sessionId = null;
  currentPosts = [];
  selectedIds.clear();
  selectedTopics.clear();
  confidenceHistory = [];
  stylePrefsHistory = [];
  allStylePrefsHistory = [];
  lastProfile = null;
  lastConfidence = null;
  lastStylePrefs = null;

  document.getElementById('complete-screen').classList.add('hidden');
  document.getElementById('complete-screen').querySelectorAll('.dynamic-action-btn').forEach(el => el.remove());
  document.getElementById('post-grid').classList.remove('hidden');
  document.getElementById('post-grid').innerHTML = '';
  document.getElementById('confirm-btn').classList.remove('hidden');
  document.getElementById('confirm-btn').classList.remove('active');
  document.getElementById('confirm-btn').textContent = '确认选择 →';
  document.getElementById('confirm-btn').onclick = confirmChoices;
  document.getElementById('instruction').classList.remove('hidden');
  document.getElementById('topic-grid').classList.add('hidden');
  document.getElementById('topic-grid').innerHTML = '';
  document.getElementById('profile-panel').classList.add('hidden');
  document.getElementById('conf-grid').innerHTML = '';
  document.getElementById('confidence-evolution').innerHTML = '';
  document.getElementById('style-evolution').innerHTML = '';
  document.getElementById('profile-topics').textContent = '—';
  document.getElementById('profile-style').textContent = '—';
  document.getElementById('progress-bar').style.width = '0%';

  startSession();
}

async function downloadProfile() {
  const res = await fetch(`${API}/api/session/${sessionId}/profile`);
  const data = await res.json();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `profile_${sessionId.slice(0,8)}.json`;
  a.click();
}

// ── Utils ────────────────────────────────────────────────────────
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Init ─────────────────────────────────────────────────────────
(async function init() {
  await detectArchitecture();
  startSession();
})();
</script>
